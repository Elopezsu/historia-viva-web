<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conexión con TikTok · Historia Viva</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://eunicelopez.com/tiktok-callback/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;700&display=swap');
:root{--indigo:#3B2E5A;--coral:#E4572E;--ink:#1E1B24;--marfil:#F7F3EC}
*{box-sizing:border-box}
body{margin:0;background:var(--marfil);color:var(--ink);font:17px/1.65 Inter,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px 80px}
h1{font-family:'Playfair Display',Georgia,serif;color:var(--indigo);font-size:2.1rem;line-height:1.2;margin:0 0 8px}
h2{font-family:'Playfair Display',Georgia,serif;color:var(--indigo);font-size:1.3rem;margin:32px 0 8px}
.fecha{color:#6b6475;font-size:.95rem;margin-bottom:32px}
a{color:var(--coral)}
code{display:block;background:#fff;border:1px solid #ddd5c8;border-radius:8px;padding:14px;word-break:break-all;font-size:15px}
button{margin-top:12px;background:var(--indigo);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:500 16px Inter,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Conexión con TikTok</h1>
<p id="msg">Esperando la respuesta de TikTok…</p>
<code id="code" hidden></code>
<button id="copiar" hidden>Copiar código</button>
<script>
const p = new URLSearchParams(location.search);
const c = p.get('code'), e = p.get('error');
const m = document.getElementById('msg');
if (c) {
  m.textContent = 'Listo. Copia este código y pégalo en la terminal (caduca en pocos minutos):';
  const el = document.getElementById('code'); el.textContent = c; el.hidden = false;
  const b = document.getElementById('copiar'); b.hidden = false;
  b.onclick = () => navigator.clipboard.writeText(c).then(() => b.textContent = 'Copiado ✓');
} else if (e) {
  m.textContent = 'TikTok devolvió un error: ' + e + ' ' + (p.get('error_description') || '');
} else {
  m.textContent = 'Esta página recibe la autorización de TikTok para el tablero interno de métricas.';
}
</script>
<p style="margin-top:48px"><a href="/">← eunicelopez.com</a></p>
</main>
</body>
</html>
